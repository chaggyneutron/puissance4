# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/puissance4
spring.datasource.username=aymen
spring.datasource.password=aymen
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security (désactive temporairement pour tester)
spring.security.user.name=admin
spring.security.user.password=admin

# JWT
jwt.secret=puissance4-secret-key-very-long-for-security-256bits
jwt.expiration=86400000
